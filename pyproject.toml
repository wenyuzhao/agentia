[project]
name = "agentia"
version = "0.1.41"
description = "Ergonomic LLM Agents"
authors = [{ name = "Wenyu Zhao", email = "wenyuzhaox@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = [
    "chatgpt",
    "gpt",
    "llm",
    "agent",
    "tools",
    "openai",
    "openrouter",
    "ai-sdk",
    "skills",
    "mcp",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "python-dotenv>=1.0.0,<2",
    "python-frontmatter>=1.1.0",
]

[project.urls]
Repository = "https://github.com/wenyuzhao/agentia"

[project.optional-dependencies]
# The Web plugin (WebSearch / WebFetch) and LoadFile for web URLs.
web = ["markdownify>=1.2.2", "tavily-python>=0.7.21"]
# PIL images as @magic arguments.
vision = ["pillow>=12.1.0"]
# patch_asyncio() for notebooks.
notebook = ["nest-asyncio>=1.6.0"]
all = ["agentia[web,vision,notebook]"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pyright>=1.1.361,<2",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.12",
    "streamlit>=1.52.2",
]

[tool.hatch.build.targets.sdist]
include = ["src/agentia"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentia"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real model APIs (needs AGENTIA_LIVE_TESTS=1 and API keys)"]

[tool.ruff.lint.per-file-ignores]
# Star imports are used intentionally to re-export model/stream symbols.
"src/agentia/__init__.py" = ["F403", "F405"]
"src/agentia/models/__init__.py" = ["F403"]
"src/agentia/models/chat.py" = ["F403", "F405"]
"src/agentia/models/stream.py" = ["F403", "F405"]
"src/agentia/history.py" = ["F403", "F405"]
"src/agentia/llm/react.py" = ["F403", "F405"]
"src/agentia/llm/stream.py" = ["F403", "F405"]
"src/agentia/llm/providers/_openai_api.py" = ["F403", "F405"]
